trigger:
  branches:
    include:
      - main
      - development
      - PDF-PLANS
      - muskaan
 
pr: none
 
pool:
  vmImage: ubuntu-latest
 
variables:
  - group: 'New variable group 05-Jun'
 
steps:
 
- checkout: self
 
 
# Detect application
- bash: |
    REPO="$(Build.Repository.Name)"
    BRANCH="$(Build.SourceBranchName)"
 
    case "$REPO:$BRANCH" in
 
      "AIIOTs-Geek/Datalect_POC_usermangement:main")
        APP_NAME="DataLect_UM_POC_Api"
        APP_PATH="/home/serverguy/apps/Datalect_POC/UM_POC/Datalect_POC_usermangement"
        TYPE="backend"
        ;;
 
      "AIIOTs-Geek/ML_Pipeline_platform-O:development")
        APP_NAME="ML-Pipeline-Platform"
        APP_PATH="/home/serverguy/apps/Datalect_POC/AI_POC/ML_Pipeline/ML_Pipeline_platform-O"
        TYPE="backend"
        ;;
 
      "AIIOTs-Geek/AI_POC:PDF-PLANS")
        APP_NAME="AI_PDF_PL"
        APP_PATH="/home/serverguy/apps/Datalect_POC/AI_POC/AI_PDF_PLAN/AI_POC"
        TYPE="backend"
        ;;
 
      "AIIOTs-Geek/AI_POC:muskaan")
        APP_NAME="Story-POC"
        APP_PATH="/home/serverguy/apps/Datalect_POC/AI_POC/Story_POC/AI_POC/qa_pipeline"
        TYPE="story"
        ;;
 
      "AIIOTs-Geek/FE_POC:main")
        APP_NAME="FE_UM_POC"
        APP_PATH="/home/serverguy/apps/Datalect_POC/UM_FE_POC/FE_POC"
        TYPE="frontend"
        ;;
 
      *)
        echo "❌ Repository/branch is not configured:"
        echo "$REPO:$BRANCH"
        exit 1
        ;;
    esac
 
    echo "##vso[task.setvariable variable=APP_NAME]$APP_NAME"
    echo "##vso[task.setvariable variable=APP_PATH]$APP_PATH"
    echo "##vso[task.setvariable variable=TYPE]$TYPE"
 
    echo "Application : $APP_NAME"
    echo "Branch      : $BRANCH"
    echo "Path        : $APP_PATH"
 
 
# Notify started
- bash: |
    chmod +x "$(Build.SourcesDirectory)/notify.sh"
    "$(Build.SourcesDirectory)/notify.sh" started
  displayName: "📢 Deployment Started"
  env:
    TEAMS_WEBHOOK: $(TEAMS_WEBHOOK)
    NOTIFY_APPLICATION: $(APP_NAME)
 
 
# SSH key
- task: DownloadSecureFile@1
  name: sshKey
  inputs:
    secureFile: id_ed25519
 
 
# Deploy
- bash: |
    chmod 600 "$(sshKey.secureFilePath)"
 
    ssh -t \
      -o StrictHostKeyChecking=no \
      -i "$(sshKey.secureFilePath)" \
      serverguy@187.127.171.37 \
      "ssh -p 2222 \
      -o StrictHostKeyChecking=no \
      serverguy@127.0.0.1 \
      'set -e
 
      cd $(APP_PATH)
 
      git fetch origin $(Build.SourceBranchName)
      git reset --hard origin/$(Build.SourceBranchName)
 
      source ~/.nvm/nvm.sh
      nvm use 22.23.2
 
      if [ \"$(TYPE)\" = \"frontend\" ]; then
        npm ci --legacy-peer-deps
        npm run build
      fi
 
      if pm2 describe \"$(APP_NAME)\" >/dev/null 2>&1; then
 
        pm2 reload \"$(APP_NAME)\"
 
      elif [ \"$(TYPE)\" = \"story\" ]; then
 
        /home/serverguy/apps/Datalect_POC/AI_POC/venv/bin/python \
          -m uvicorn narrative.main:app \
          --host 0.0.0.0 \
          --port 9362 \
          --timeout-keep-alive 1200 \
          --timeout-graceful-shutdown 1200 \
          --name \"$(APP_NAME)\"
 
      else
 
        pm2 start ecosystem.config.js
 
      fi
 
      pm2 save
      pm2 status
      '"
  displayName: "🚀 Deploy"
 
 
# Notify success
- bash: |
    "$(Build.SourcesDirectory)/notify.sh" success
  displayName: "📢 Deployment Successful"
  condition: succeeded()
  env:
    TEAMS_WEBHOOK: $(TEAMS_WEBHOOK)
    NOTIFY_APPLICATION: $(APP_NAME)
 
 
# Notify failure
- bash: |
    "$(Build.SourcesDirectory)/notify.sh" failed
  displayName: "📢 Deployment Failed"
  condition: failed()
  env:
    TEAMS_WEBHOOK: $(TEAMS_WEBHOOK)
    NOTIFY_APPLICATION: $(APP_NAME)
 