<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <rect width="24" height="24" rx="5" fill="#FAF5FF"/>
  <!-- Robot Agent Head -->
  <rect x="5.5" y="7.5" width="13" height="11" rx="3" stroke="#7C3AED" stroke-width="1.4" fill="#7C3AED" fill-opacity="0.15"/>
  <!-- Antenna -->
  <line x1="12" y1="4.5" x2="12" y2="7.5" stroke="#7C3AED" stroke-width="1.3"/>
  <circle cx="12" cy="4.5" r="1" fill="#7C3AED"/>
  <!-- Eyes -->
  <circle cx="9.5" cy="11.5" r="1.5" fill="#7C3AED"/>
  <circle cx="14.5" cy="11.5" r="1.5" fill="#7C3AED"/>
  <!-- Mouth Line -->
  <line x1="9.5" y1="15" x2="14.5" y2="15" stroke="#7C3AED" stroke-width="1.3" stroke-linecap="round"/>
</svg>
